[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-testing-agent"
version = "0.1.0"
description = "AI agent for end-to-end A/B testing: design, scheduling, splitting, and statistical analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.1",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ab-agent = "ab_testing_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
